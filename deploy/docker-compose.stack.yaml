# FTM production stack — runs on the ephemeral stack VM (no public IP).
# nginx is NOT here: it runs on the edge VM and proxies over the private network.
# The Vite frontend is served as static dist/ by the edge nginx, not here.
#
# Network segmentation (least-privilege egress):
#   - internal_net (internal: true): pg-keycloak, pg-app, minio, keycloak.
#     No gateway, no internet egress — these never need to call out.
#   - egress_net (normal bridge): bff, worker — they call the external LLM, so they
#     need outbound internet. Services that talk to BOTH data and the LLM join both nets.
#
# Security posture:
#   - NO service publishes to 0.0.0.0. bff/keycloak publish to the stack's PRIVATE IP
#     only (${STACK_PRIVATE_IP}, e.g. 10.0.1.20), so the edge reaches them over the
#     Hetzner private network but nothing is exposed publicly.
#   - MinIO console (:9001) is never published.
#   - All credentials come from the SOPS-rendered .env (PR3); no hardcoded secrets.

services:
  postgres-keycloak:
    image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - /mnt/ftm-data/pg-keycloak:/var/lib/postgresql/data
    networks: [internal_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${KC_DB_USER} -d $${KC_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3@sha256:5fdbf2dbb5897cc34e82de49d13e23db011f9925089dbc555fc095f2c8bc1dac
    # Build first, THEN start --optimized in the SAME process. Running plain `start`
    # (which builds implicitly) makes Keycloak re-exec internally after the build,
    # and Docker loses the published port binding (NetworkSettings.Ports becomes null
    # even though HostConfig has it). `kc.sh build && exec start --optimized` keeps the
    # final server as PID 1 so the port stays published.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "/opt/keycloak/bin/kc.sh build && exec /opt/keycloak/bin/kc.sh start --optimized --import-realm"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Full URL with scheme (not a bare hostname) so Keycloak builds absolute frontend
      # URLs deterministically instead of inferring the scheme from X-Forwarded-Proto.
      # The admin console is NOT served through the edge (see nginx: /admin is not proxied,
      # and the CSP blocks it); administration is done with kcadm.sh inside the container
      # (see RUNBOOK "Keycloak administration"), so no admin-specific hostname is needed.
      KC_HOSTNAME: https://${DOMAIN}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Bind HTTP to all interfaces. Without this Keycloak listens on 127.0.0.1 inside
      # the container, so container-to-container works but Docker port publishing to the
      # host (10.0.1.20:8080) silently yields no active binding (NetworkSettings null).
      KC_HTTP_HOST: 0.0.0.0
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # Publish to the stack's PRIVATE IP only — edge nginx proxies /realms here.
    # Long-form so host_ip is explicit and never falls back to 0.0.0.0.
    ports:
      - target: 8080
        published: 8080
        host_ip: ${STACK_PRIVATE_IP}
        protocol: tcp
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    # internal_net to reach its postgres; egress_net so Docker can publish 8080 to the
    # host (a container ONLY on an `internal: true` net cannot publish ports — that net
    # has no host connectivity). The edge reaches keycloak via 10.0.1.20:8080.
    networks: [internal_net, egress_net]
    restart: unless-stopped

  postgres-app:
    image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
    # Superuser = the ADMIN role (owns tables, runs migrations, executes SECURITY
    # DEFINER helpers, bypasses RLS by design). The bff/worker connect as ftm_app
    # (a NOINHERIT LOGIN role that only SET LOCAL ROLEs into the RLS roles) — NEVER
    # as the owner, so RLS applies to them. Collapsing these two was the RLS bypass bug.
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${ADMIN_DB_USER}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
    volumes:
      - /mnt/ftm-data/pg-app:/var/lib/postgresql/data
    networks: [internal_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${ADMIN_DB_USER} -d $${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-eu-central-1}
    volumes:
      - /mnt/ftm-data/minio:/data
    # S3 API (:9000) published to the PRIVATE IP only, so the edge can proxy presigned
    # browser uploads/downloads to it. Console (:9001) is NEVER published (admin surface).
    # egress_net gives host connectivity for the port publish (internal-only nets can't).
    ports:
      - target: 9000
        published: 9000
        host_ip: ${STACK_PRIVATE_IP}
        protocol: tcp
    networks: [internal_net, egress_net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket + the scoped service user (ftm-recordings-svc) with a
  # policy limited to the recordings bucket (no admin rights). Without this the bucket
  # and user don't exist and presigned PUTs get 403. Mirrors the dev recording-db init.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set ftm http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing ftm/"$${MINIO_BUCKET}"
        mc anonymous set none ftm/"$${MINIO_BUCKET}"
        mc version enable ftm/"$${MINIO_BUCKET}"
        cat > /tmp/policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${MINIO_BUCKET}","arn:aws:s3:::$${MINIO_BUCKET}/*"]
            }
          ]
        }
        POLICY
        mc admin policy create ftm ftm-recordings-rw /tmp/policy.json || true
        mc admin user add ftm "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}"
        mc admin policy attach ftm ftm-recordings-rw --user "$${MINIO_APP_USER}" || true
        echo "MinIO ready: bucket $${MINIO_BUCKET}, scoped user $${MINIO_APP_USER}"
    networks: [internal_net]
    restart: "no"

  bff:
    image: ${API_IMAGE:-ghcr.io/josepcal/tfm_rehab_followup_checkup/api:latest}
    # Env var names MUST match app/config.py (pydantic Settings), case-insensitive.
    environment:
      APP_ENV: prod
      AUTH_MODE: keycloak
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres-app:5432/${APP_DB_NAME}
      KEYCLOAK_ISSUER: https://${DOMAIN}/realms/${KC_REALM}
      KEYCLOAK_JWKS_URL: https://${DOMAIN}/realms/${KC_REALM}/protocol/openid-connect/certs
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      # Browser-facing endpoint for presigned URLs (routed to MinIO via the edge).
      S3_PUBLIC_ENDPOINT_URL: https://${DOMAIN}
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: ${MINIO_REGION:-eu-central-1}
      S3_FORCE_PATH_STYLE: "true"
      NATIONAL_ID_ENCRYPTION_KEY: ${NATIONAL_ID_ENCRYPTION_KEY}
    # Publish to the stack's PRIVATE IP only — edge nginx proxies /api here.
    # Long-form so host_ip is explicit and never falls back to 0.0.0.0.
    ports:
      - target: 8000
        published: 8000
        host_ip: ${STACK_PRIVATE_IP}
        protocol: tcp
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Both nets: internal_net for pg/minio/keycloak, egress_net for the LLM.
    networks: [internal_net, egress_net]
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:-ghcr.io/josepcal/tfm_rehab_followup_checkup/api:latest}
    command: ["python", "-m", "app.worker"]
    # Env var names MUST match app/config.py (pydantic Settings).
    environment:
      APP_ENV: prod
      AUTH_MODE: keycloak
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres-app:5432/${APP_DB_NAME}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: ${MINIO_REGION:-eu-central-1}
      S3_FORCE_PATH_STYLE: "true"
      NATIONAL_ID_ENCRYPTION_KEY: ${NATIONAL_ID_ENCRYPTION_KEY}
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Both nets: internal_net for pg/minio, egress_net for the LLM.
    networks: [internal_net, egress_net]
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge
