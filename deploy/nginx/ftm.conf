# Edge nginx — production vhost for FTM.
# Runs on the always-on edge VM. Terminates TLS, serves the Vite frontend as static,
# and proxies /api and /realms to the stack VM over the Hetzner private network.
#
# Placeholders replaced at deploy time (PR3 runbook / edge config):
#   __DOMAIN__            -> your domain (e.g. ftm-demo.duckdns.org)
#   __STACK_PRIVATE_IP__  -> stack VM private IP (e.g. 10.0.1.20)

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name __DOMAIN__;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` form for nginx 1.24 (Ubuntu 24.04). The newer `http2 on;`
    # directive is only available in nginx 1.25+.
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (single public edge)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # connect-src 'self' allows the SPA's fetch/XHR (incl. presigned MinIO uploads,
    # which are same-origin now that /ftm-recordings/ is proxied through this host).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # WAV uploads can be sizeable
    client_max_body_size 30m;

    # --- API (FastAPI bff) -> stack VM private IP:8000 ---
    location /api/ {
        proxy_pass          http://__STACK_PRIVATE_IP__:8000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  90;
    }

    # --- Object storage (MinIO) presigned URLs -> stack VM private IP:9000 ---
    # The browser hits https://<domain>/ftm-recordings/<key>?X-Amz-... The presigned
    # signature is computed over this exact public host+path (S3_PUBLIC_ENDPOINT_URL =
    # https://<domain>), so we forward WITHOUT rewriting the path — any rewrite would
    # break the S3v4 signature. Routing by the bucket name keeps it path-style clean.
    location /ftm-recordings/ {
        proxy_pass          http://__STACK_PRIVATE_IP__:9000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout  120;
    }

    # --- Keycloak (OIDC) -> stack VM private IP:8080 ---
    # Only the paths the SPA login flow needs are public: /realms (token/auth
    # endpoints), /resources and /js (login-page assets). The admin console
    # (/admin) is deliberately NOT proxied — it is attack surface and its inline
    # scripts are incompatible with this edge's strict CSP anyway. Administer
    # Keycloak over an SSH tunnel to the stack instead (see RUNBOOK "Keycloak
    # admin console").
    location ~ ^/(realms|resources|js)/ {
        proxy_pass              http://__STACK_PRIVATE_IP__:8080;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      90;
        proxy_connect_timeout   90;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --- Vite frontend (static dist/, served directly by the edge) ---
    location / {
        root      /var/www/ftm;
        try_files $uri /index.html;
    }
}
