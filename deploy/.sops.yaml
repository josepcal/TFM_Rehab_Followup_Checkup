# SOPS ruleset. Replace the age recipient with YOUR age public key
# (generate with: age-keygen -o age.key ; the public key is printed as `age1...`).
#
# Encrypt:  sops --encrypt --age age1YOURPUBLICKEY deploy/secrets.sops.yaml.example > deploy/secrets.sops.yaml
# Edit:     sops deploy/secrets.sops.yaml
creation_rules:
  - path_regex: deploy/secrets\.sops\.yaml$
    age: "age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY"
