name: Build & Push Images

# Builds and publishes the api image to GHCR. The stack compose (deploy/) consumes it
# as ghcr.io/<repo>/api:latest. The worker reuses this same image (runs `python -m app.worker`).
#
# Migration and deploy are intentionally NOT here — they are separate concerns wired up
# once the production infra exists (see deploy/RUNBOOK.md).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # allow manual runs (e.g. build before the code reaches main)

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api (also used by the worker)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
