name: Build & Push Images

# Builds and publishes the api image to GHCR. The stack compose (deploy/) consumes it
# as ghcr.io/<repo>/api:latest. The worker reuses this same image (runs `python -m app.worker`).
#
# Migration and deploy are intentionally NOT here — they are separate concerns wired up
# once the production infra exists (see deploy/RUNBOOK.md).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
    # Version tags publish an immutable `api:vX.Y.Z` that deploys can pin to.
    # No `paths` filter here: a release tag must always produce its image.
    tags: ["v*"]
  workflow_dispatch: {} # allow manual runs (e.g. build before the code reaches main)

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires the repository path to be lowercase; ${{ github.repository }}
      # preserves the original casing, so lowercase it explicitly.
      - name: Compute lowercase image prefix
        id: img
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build & push api (also used by the worker)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          # On a version tag: publish `api:vX.Y.Z` and do NOT move `latest` — an older
          # release re-tagged later must not overwrite what main currently points at.
          # On a branch push: publish the sha and move `latest` as before.
          tags: |
            ${{ steps.img.outputs.prefix }}/api:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v')
                && format('{0}/api:{1}', steps.img.outputs.prefix, github.ref_name)
                || format('{0}/api:latest', steps.img.outputs.prefix) }}
